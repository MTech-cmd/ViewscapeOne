<!doctype html>
<html lang="en" data-accent="violet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Custom Lab</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="../../../assets/css/theme.css">
  <link rel="stylesheet" href="../../../assets/css/glass.css">
  <link rel="stylesheet" href="../../../assets/css/holo.css">
  <link rel="stylesheet" href="../../../assets/css/wheel.css">
  <link rel="stylesheet" href="../../../assets/css/blocks.css">
  <link rel="stylesheet" href="page.css">
</head>
<body data-vs-page data-vs-mode="custom">
  <main class="vs-wrap">
    <div class="vs-eyebrow">✦ custom page</div>
    <h1 class="vs-title">Custom Lab</h1>
    <p class="vs-sub">Your own HTML, your own canvas — plus the wheel on the right.</p>

    <section data-vs-section="Orbit" data-vs-icon="cube" data-reveal>
      <div class="vs-glass lab-card">
        <canvas id="orbit" width="900" height="420"></canvas>
        <div class="lab-bar">
          <button class="vs-btn" id="burst">Burst</button>
          <button class="vs-btn ghost" id="flip">Reverse</button>
          <span class="vs-chip static" id="fps">— fps</span>
        </div>
      </div>
    </section>

    <section data-vs-section="Blocks" data-vs-icon="layers" data-reveal>
      <h2 class="vs-h">Library blocks inside custom markup</h2>
      <div id="mount"></div>
    </section>
  </main>

  <script src="../../../assets/js/vs.validate.js"></script>
  <script src="../../../assets/js/vs.core.js"></script>
  <script src="../../../assets/js/vs.sys.js"></script>
  <script src="../../../assets/js/vs.fx.js"></script>
  <script src="../../../assets/js/vs.blocks.js"></script>
  <script src="../../../assets/js/vs.wheel.js"></script>
  <script src="../../../assets/js/vs.page.js"></script>
  <script src="page.js"></script>
</body>
</html>
