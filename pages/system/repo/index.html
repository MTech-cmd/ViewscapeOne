<!doctype html>
<html lang="en" data-accent="magenta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GitHub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="../../../assets/css/theme.css">
  <link rel="stylesheet" href="../../../assets/css/glass.css">
  <link rel="stylesheet" href="../../../assets/css/holo.css">
  <link rel="stylesheet" href="../../../assets/css/wheel.css">
  <link rel="stylesheet" href="../../../assets/css/blocks.css">
  <link rel="stylesheet" href="page.css">
</head>
<!-- CUSTOM MODE: your own HTML/CSS/JS. You still get ambience, loader and the wheel.
     Mark jump targets with data-vs-section="Label" so they appear in the wheel. -->
<body data-vs-page data-vs-mode="custom">
  <main class="vs-wrap">
    <div class="vs-eyebrow">✦ github · rendered inside the viewscape</div>
    <h1 class="vs-title">GitHub</h1>
    <form class="repo-head vs-glass" id="repo-form" autocomplete="off">
      <span class="ic" id="repo-ic"></span>
      <input id="repo-in" class="vs-input" placeholder="owner/repo" spellcheck="false" autocapitalize="off" aria-label="GitHub repository (owner/repo)">
      <button class="vs-btn sm" type="submit">Load</button>
      <button class="vs-btn ghost sm" type="button" id="repo-open">Open on GitHub ↗</button>
    </form>
    <div id="repo-out" data-vs-section="Repository" data-vs-icon="github"></div>
  </main>
  <script src="../../../assets/js/vs.validate.js"></script>
  <script src="../../../assets/js/vs.core.js"></script>
  <script src="../../../assets/js/vs.sys.js"></script>
  <script src="../../../assets/js/vs.fx.js"></script>
  <script src="../../../assets/js/vs.blocks.js"></script>
  <script src="../../../assets/js/vs.wheel.js"></script>
  <script src="../../../assets/js/vs.page.js"></script>
  <script src="page.js"></script>
</body>
</html>
